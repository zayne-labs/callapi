name: Changeset - Release and Publish
on:
   push:
      branches: main

permissions:
   contents: write
   pull-requests: write
   id-token: write

jobs:
   release:
      runs-on: ubuntu-latest
      timeout-minutes: 15
      strategy:
         matrix:
            node-version: [lts/*]

      # if: ${{ github.event.workflow_run.conclusion == 'success' }}
      steps:
         - name: Checkout repo
           uses: actions/checkout@v6
           with:
              # This makes Actions fetch all Git history so that Changesets
              # can generate changelogs with the correct commits.
              fetch-depth: 0

         - name: Setup pnpm
           uses: pnpm/action-setup@v5
           with:
              version: 12.5.1

         - name: Setup Node.js
           uses: actions/setup-node@v6 # v4
           with:
              node-version: ${{ matrix.node-version }}
              cache: pnpm
              # changesets/action v2 no longer writes .npmrc from NPM_TOKEN, so setup-node writes it instead
              registry-url: "https://registry.npmjs.org"

         - name: Install dependencies and build
           run: |
              pnpm install --frozen-lockfile
              pnpm build

         - name: Create Release Pull Request or Publish to npm
           uses: changesets/action@v2.1.2
           with:
              commit-message: "ci(changesets): update package version"
              pr-title: "ci(changesets): update package version"
              publish-script: pnpm release
              github-token: ${{ secrets.GITHUB_TOKEN }}

           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
